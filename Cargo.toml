[package]
name = "gpui_full"
version = "0.2.2"
edition.workspace = true
description = "Zed's GPU-accelerated UI framework (full)"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true

[features]
default = ["multithreaded", "font-kit", "wayland", "x11", "windows-manifest"]

test-support = [
    "wayland",
    "x11",
    "gpui/proptest",
    "gpui/test-support", 
    "gpui_platform/test-support"
]
# Preserve the published feature name while consumers migrate to `bench-support`.


# gpui
bench-support = ["profiler","bench", "gpui_platform/bench-support"]
bench = ["gpui/bench-support"]
# Tracks every entity handle so tests can assert nothing leaked. Also enabled
# by setting `GPUI_LEAK_DETECTION` when building; see `build.rs`.
leak-detection = [ "gpui/leak-detection" ]
windows-manifest = ["gpui/windows-manifest"]
profiler = ["gpui/profiler"]
stacker = ["gpui/stacker"]
hot-reload = [ "gpui/hot-reload" ]

# gpui_platform
multithreaded = ["gpui_platform/multithreaded"]
font-kit = [ "gpui/font-kit", "gpui_platform/font-kit"]
inspector = [ "gpui/inspector", "gpui_platform/inspector"]
screen-capture = [ "gpui/screen-capture", "gpui_platform/screen-capture"]
runtime_shaders = ["gpui_platform/runtime_shaders"]
wayland =[ "gpui/wayland", "gpui_platform/wayland"]
x11 = [ "gpui/x11", "gpui_platform/x11"]


[workspace]
resolver = "3"
members = [
  "gpui",
  "gpui_platform",
  "gpui_util",
  "scheduler" ,
  "util_macros",
  "http_client",
  "reqwest_client",
  "gpui_web",
  "collections"
]

[workspace.package]
publish = false
edition = "2024"
# version = "0.0.1"


[workspace.dependencies]
# dev
backtrace = "0.3"
env_logger = "0.11"
futures = "0.3.34"
futures-concurrency = "7.7.1"
postage = { version = "0.5", default-features = false }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
web-sys = "0.3"
web-time = "1.1.0"
webpki-roots = "1.0.10"
webrtc-sys = "0.3.23"
proptest = { version = "1.12.0", features = ["attr-macro"] }
wasm-bindgen = "0.2.120"


# internel
bench_metrics = { path = "bench_metrics" }
refineable = { path = "refineable" }
sum_tree = { path = "sum_tree" }
gpui_macros = { path = "gpui_macros", default-features = false }
gpui_shared_string = { path = "gpui_shared_string" }

# internel build
collections = { path = "collections", version = "0.1.0" }
gpui_platform = { path = "gpui_platform" }
gpui_util = { path = "gpui_util" }
gpui_web = { path = "gpui_web" }
gpui = { path = "gpui" }
scheduler = { path = "scheduler" }
util_macros = { path = "util_macros" }
http_client = { path = "http_client" }
reqwest_client = { path = "reqwest_client" }

# internal sub
derive_refineable = { path = "refineable/derive_refineable" }
ztracing = { path = "ztracing" }
ztracing_macro = { path = "ztracing_macro" }
zlog = { path = "zlog" }
gpui_linux = { path = "gpui_linux", default-features = false }
gpui_ios = { path = "gpui_ios" }
gpui_macos = { path = "gpui_macos" }
gpui_apple = { path = "gpui_apple" }
gpui_wgpu = { path = "gpui_wgpu" }
gpui_windows = { path = "gpui_windows" }
